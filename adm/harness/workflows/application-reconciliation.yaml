name: application-reconciliation
version: 0.1.0
status: draft
description: Generate canonical application proposals and exception queues while preserving source identities and avoiding automatic merges.
policy_refs:
  - ../policies/safety-policy.md
  - ../policies/approval-gates.md
inputs:
  - name: run_manifest
    schema_ref: ../contracts/run-manifest.schema.json
    required: true
  - name: source_records
    schema_ref: ../contracts/source-record-set.schema.json
    required: true
  - name: source_catalogue
    schema_ref: ../contracts/source-catalogue.schema.json
    required: true
steps:
  - id: validate-sources
    kind: deterministic
    description: Verify source IDs, manifest scope, and required provenance. Do not transform source values in place.
    allowed_tools: [schema.validate, file.read_scoped]
    inputs: [run_manifest, source_records, source_catalogue]
    outputs: [validated_source_records]
    on_failure: stop_run
  - id: generate-match-candidates
    kind: model
    description: Apply identifier priority and corroborating evidence; fuzzy/name similarity may only create candidate exceptions.
    prompt_ref: ../prompts/reconciliation-analyst.md
    allowed_tools: [model.structured_output]
    inputs: [validated_source_records]
    outputs: [reconciliation_proposals]
    on_failure: retry_once_then_stop
  - id: validate-proposals
    kind: deterministic
    description: Validate canonical application records and exception references; check original ID preservation and candidate status.
    allowed_tools: [schema.validate]
    inputs: [reconciliation_proposals]
    outputs: [validated_reconciliation]
    on_failure: queue_exception
  - id: identity-and-taxonomy-review
    kind: human_gate
    description: Resolve material identity, domain/group, field-conflict, ownership, and lifecycle questions.
    allowed_tools: [none]
    inputs: [validated_reconciliation]
    outputs: [reviewed_reconciliation]
    human_gate:
      required: true
      reviewer_role: application_owner_and_domain_steward
      criteria:
        - No merge is based on name similarity alone.
        - Unknown owners and conflicting values remain explicit until decided.
        - Business domain and application group are logical and evidence-backed.
    on_failure: stop_run
  - id: write-draft-register
    kind: deterministic
    description: Store draft proposal and exception artefacts; do not update any source or target system.
    allowed_tools: [artifact.write_draft, schema.validate]
    inputs: [reviewed_reconciliation]
    outputs: [draft_application_register]
    on_failure: stop_run
outputs:
  - name: reconciliation_output
    schema_ref: ../contracts/reconciliation-output.schema.json
    draft_only: true
failure_policy: stop_on_policy_violation
