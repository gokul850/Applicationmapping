<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px;
      height: 720px;
      background: #0A192F;
      color: #F1F5F9;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
    }
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.25;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
    }
    .accent-line {
      width: 120px;
      height: 4px;
      background: #0D9488;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
      max-width: 900px;
    }
    .subtitle {
      font-size: 24px;
      color: #F8F9FA;
      opacity: 0.9;
      margin-bottom: 48px;
    }
    .draft-tag {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .draft-square {
      width: 12px;
      height: 12px;
      background: #D97706;
    }
    .draft-text {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #D97706;
      font-weight: 700;
    }
    .footer {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 14px;
      color: #F1F5F9;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <img src="./assets/network-bg.jpeg" class="background-image">
    <div class="draft-tag">
      <span class="draft-text">Proposal Only</span>
      <div class="draft-square"></div>
    </div>
    <div class="content">
      <div class="accent-line"></div>
      <h1>A Bounded AI Agent Harness for CMDB & ADM</h1>
      <p class="subtitle">Policy-First Orchestration for Reconciled Infrastructure and Application Dependencies</p>
    </div>
    <div class="footer">
      ADM Project | AI-SDLC Implementation Plan | Draft v0.1.0
    </div>
  </div>
</body>
</html>
